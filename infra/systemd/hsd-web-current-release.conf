# Release template. The API base must be the reviewed production origin.
[Service]
WorkingDirectory=/var/www/hsd/releases/<release-id>/frontend
Environment=NODE_ENV=production
Environment=NITRO_HOST=127.0.0.1
Environment=NITRO_PORT=3000
Environment=NITRO_PUBLIC_USE_MOCK_API=false
Environment=NITRO_PUBLIC_API_BASE=https://114.132.236.244
ExecStart=
ExecStart=/opt/hsd/node/bin/node .output/server/index.mjs
