name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Check TypeScript
        run: pnpm run typecheck

      - name: Build production bundle
        run: pnpm run build:verify

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm run test:e2e

      - name: Run production-mode API end-to-end tests
        run: pnpm exec playwright test tests/e2e/task-3c-admin-content-real.spec.ts tests/e2e/task-3c-admin-audit-real.spec.ts tests/e2e/task-3c-admin-uploads-real.spec.ts tests/e2e/task-3c-admin-resources-real.spec.ts tests/e2e/task-3c-recruitment-batches-real.spec.ts tests/e2e/task-3c-admin-recruitment-lifecycle-real.spec.ts tests/e2e/task-3c-admin-recruitment-workspaces-real.spec.ts --config playwright.config.task-3c-real.ts
